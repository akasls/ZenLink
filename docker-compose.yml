version: '3.8'

services:
  zenlink:
    image: zenlink:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenlink
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # JWT_SECRET 可选：系统会自动生成并安全持久化在数据卷的 .jwt_secret 中，无需手动配置
      # - JWT_SECRET=your_custom_secret_key
    volumes:
      # 持久化数据库与上传文件
      - ./zenlink_data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
