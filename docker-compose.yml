version: '3.8'

services:
  zenlink:
    image: zenlink:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenlink
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=zenlink_secure_secret_key_change_me
    volumes:
      # 持久化数据库与上传文件
      - ./zenlink_data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
