<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenLink 侧边栏 4 大优化方案交互原型</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* 模仿 ZenLink 的配色设计体系 */
    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #f4f4f5;
      --muted-fg: #71717a;
      --border: #e4e4e7;
      --card: #ffffff;
      --primary: #18181b;
      --primary-fg: #fafafa;
      --accent: #f4f4f5;
      --accent-fg: #18181b;
      --sidebar-bg: #fafafa;
      --sidebar-border: #eaeaea;
    }
    .dark {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #27272a;
      --muted-fg: #a1a1aa;
      --border: #27272a;
      --card: #18181b;
      --primary: #fafafa;
      --primary-fg: #18181b;
      --accent: #27272a;
      --accent-fg: #fafafa;
      --sidebar-bg: #121215;
      --sidebar-border: #27272a;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark .custom-scroll::-webkit-scrollbar-thumb {
      background: #3f3f46;
    }
    .transition-width {
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col select-none">

  <!-- 顶部控制栏 (方案切换、主题切换、当前模式模拟) -->
  <header class="sticky top-0 z-50 px-4 py-2.5 bg-[var(--card)]/90 backdrop-blur-md border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-3 shadow-xs">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="size-7 rounded-lg bg-zinc-900 text-zinc-50 dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-bold text-xs">
          Z
        </div>
        <span class="font-semibold text-sm tracking-tight">侧边栏方案对比</span>
      </div>

      <!-- 4 大方案选择器 -->
      <div class="flex items-center p-1 bg-[var(--muted)] rounded-xl border border-[var(--border)]/60 text-xs font-medium">
        <button id="btn-p1" onclick="switchProposal(1)" class="px-3 py-1 rounded-lg transition-all text-xs font-semibold shadow-xs bg-[var(--card)] text-[var(--fg)]">
          方案 1: 双轨 Dock (推荐)
        </button>
        <button id="btn-p2" onclick="switchProposal(2)" class="px-3 py-1 rounded-lg transition-all text-xs text-[var(--muted-fg)] hover:text-[var(--fg)]">
          方案 2: 悬浮岛屿卡片
        </button>
        <button id="btn-p3" onclick="switchProposal(3)" class="px-3 py-1 rounded-lg transition-all text-xs text-[var(--muted-fg)] hover:text-[var(--fg)]">
          方案 3: 顶部药丸切换
        </button>
        <button id="btn-p4" onclick="switchProposal(4)" class="px-3 py-1 rounded-lg transition-all text-xs text-[var(--muted-fg)] hover:text-[var(--fg)]">
          方案 4: 禅模式极简
        </button>
      </div>
    </div>

    <!-- 右侧工具条：深色模式切换 & 说明 -->
    <div class="flex items-center gap-2">
      <!-- 模拟功能切换 -->
      <div class="flex items-center p-0.5 bg-[var(--muted)] rounded-lg text-xs">
        <button id="mode-home" onclick="setAppMode('home')" class="px-2.5 py-1 rounded-md bg-[var(--card)] font-medium shadow-xs">导航</button>
        <button id="mode-ai" onclick="setAppMode('ai')" class="px-2.5 py-1 rounded-md text-[var(--muted-fg)] hover:text-[var(--fg)]">AI</button>
        <button id="mode-notes" onclick="setAppMode('notes')" class="px-2.5 py-1 rounded-md text-[var(--muted-fg)] hover:text-[var(--fg)]">笔记</button>
      </div>

      <button onclick="toggleTheme()" class="size-8 rounded-lg border border-[var(--border)] flex items-center justify-center hover:bg-[var(--muted)] text-[var(--muted-fg)] hover:text-[var(--fg)] transition-colors" title="切换深色/浅色">
        <svg id="theme-icon" class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 方案说明条 (动态根据当前选中的方案提示其特点) -->
  <div class="px-4 py-2 bg-blue-500/10 border-b border-blue-500/20 text-xs text-blue-600 dark:text-blue-400 flex items-center justify-between">
    <div id="proposal-desc" class="font-medium">
      💡 <strong>方案 1（双轨 Slim Dock）：</strong> 56px 极简左边栏常驻核心功能，右侧抽屉按需展开。主页看书签时抽屉可收缩，拥有最大沉浸呼吸感！
    </div>
    <span class="text-[11px] opacity-75">点击页面上的按钮可体验真实交互</span>
  </div>

  <!-- 主体工作区容器 -->
  <div class="flex-1 flex overflow-hidden relative bg-[var(--bg)] min-h-[700px]">

    <!-- ==================== 方案 1: 双轨 Dock (左 56px + 抽屉 220px) ==================== -->
    <div id="view-proposal-1" class="flex w-full h-full">
      <!-- 轨 1: 56px 固定极简 Dock -->
      <aside class="w-14 border-r border-[var(--border)] bg-[var(--sidebar-bg)] flex flex-col items-center py-3 justify-between shrink-0 z-20">
        <!-- 上部：Logo & 模式核心图标 -->
        <div class="flex flex-col items-center gap-4 w-full">
          <div class="size-8 rounded-xl bg-zinc-900 text-zinc-50 dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-bold text-sm shadow-xs">
            Z
          </div>

          <nav class="flex flex-col gap-1.5 w-full px-2">
            <!-- 导航图标 -->
            <button onclick="setAppMode('home')" id="dock-p1-home" class="group relative size-10 rounded-xl flex items-center justify-center transition-all bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 shadow-xs" title="网址导航">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            </button>
            <!-- 笔记图标 -->
            <button onclick="setAppMode('notes')" id="dock-p1-notes" class="group relative size-10 rounded-xl flex items-center justify-center transition-all text-[var(--muted-fg)] hover:text-[var(--fg)] hover:bg-[var(--muted)]" title="在线笔记">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </button>
            <!-- AI 图标 -->
            <button onclick="setAppMode('ai')" id="dock-p1-ai" class="group relative size-10 rounded-xl flex items-center justify-center transition-all text-[var(--muted-fg)] hover:text-[var(--fg)] hover:bg-[var(--muted)]" title="AI 对话">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM4 11a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7zm4 4v.01M16 15v.01"/></svg>
            </button>
          </nav>
        </div>

        <!-- 底部：抽屉折叠开关 & 设置 & 头像 -->
        <div class="flex flex-col items-center gap-2">
          <button onclick="toggleP1Drawer()" class="size-8 rounded-lg flex items-center justify-center text-[var(--muted-fg)] hover:text-[var(--fg)] hover:bg-[var(--muted)]" title="展开/收起副栏">
            <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
          </button>
          <div class="size-8 rounded-full bg-zinc-200 dark:bg-zinc-800 border border-[var(--border)] flex items-center justify-center font-medium text-xs">
            404
          </div>
        </div>
      </aside>

      <!-- 轨 2: 210px 弹性抽屉 (可折叠) -->
      <aside id="p1-drawer" class="w-56 border-r border-[var(--border)] bg-[var(--sidebar-bg)]/60 flex flex-col transition-width overflow-hidden shrink-0">
        <!-- 抽屉顶部标题 -->
        <div class="p-3 border-b border-[var(--border)]/60 flex items-center justify-between">
          <span id="p1-drawer-title" class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-fg)]">分类导航</span>
          <button onclick="toggleP1Drawer()" class="size-6 rounded hover:bg-[var(--muted)] flex items-center justify-center text-[var(--muted-fg)]">
            <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
        </div>

        <!-- 抽屉内容 (根据当前模式动态切换) -->
        <div id="p1-drawer-content" class="flex-1 overflow-y-auto p-2 space-y-1 text-xs custom-scroll">
          <!-- 动态注入列表 -->
        </div>
      </aside>

      <!-- 右侧主画布 -->
      <main class="flex-1 flex flex-col overflow-y-auto custom-scroll bg-[var(--bg)]">
        <div id="main-content-p1" class="p-8 max-w-5xl mx-auto w-full">
          <!-- 动态渲染主画布内容 -->
        </div>
      </main>
    </div>


    <!-- ==================== 方案 2: 悬浮岛屿卡片 (Floating Glass Island) ==================== -->
    <div id="view-proposal-2" class="hidden w-full h-full p-3 bg-zinc-100 dark:bg-zinc-950 flex gap-3">
      <!-- 悬浮胶囊侧边栏 (四周留白，大圆角，轻柔阴影) -->
      <aside class="w-64 rounded-2xl bg-[var(--card)]/90 backdrop-blur-md border border-[var(--border)] shadow-md flex flex-col p-3 shrink-0 justify-between">
        <div class="space-y-4">
          <!-- 顶部品牌 -->
          <div class="flex items-center justify-between px-1">
            <div class="flex items-center gap-2">
              <div class="size-7 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-bold text-xs">
                Z
              </div>
              <span class="font-semibold text-sm">ZenLink</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-800 text-[var(--muted-fg)]">Island</span>
          </div>

          <!-- 模式切换：卡片内微型 Switcher -->
          <div class="flex p-1 bg-[var(--muted)] rounded-xl gap-1 text-xs">
            <button onclick="setAppMode('home')" class="p2-btn-mode-home flex-1 py-1.5 text-center font-semibold rounded-lg bg-[var(--card)] shadow-xs">导航</button>
            <button onclick="setAppMode('ai')" class="p2-btn-mode-ai flex-1 py-1.5 text-center text-[var(--muted-fg)] rounded-lg hover:text-[var(--fg)]">AI</button>
            <button onclick="setAppMode('notes')" class="p2-btn-mode-notes flex-1 py-1.5 text-center text-[var(--muted-fg)] rounded-lg hover:text-[var(--fg)]">笔记</button>
          </div>

          <!-- 内容列表 -->
          <div id="p2-content-list" class="space-y-1 text-xs custom-scroll max-h-[460px] overflow-y-auto pr-1">
            <!-- 动态渲染 -->
          </div>
        </div>

        <!-- 底部用户与设置胶囊 -->
        <div class="pt-2 border-t border-[var(--border)] flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="size-7 rounded-full bg-zinc-200 dark:bg-zinc-800 flex items-center justify-center font-bold text-xs">404</div>
            <div class="text-[11px] leading-tight">
              <div class="font-medium">Administrator</div>
              <div class="text-[var(--muted-fg)]">系统设置</div>
            </div>
          </div>
          <button class="size-7 rounded-lg hover:bg-[var(--muted)] flex items-center justify-center text-[var(--muted-fg)]">
            <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
          </button>
        </div>
      </aside>

      <!-- 悬浮主内容大卡片 -->
      <main class="flex-1 rounded-2xl bg-[var(--card)] border border-[var(--border)] shadow-md overflow-y-auto custom-scroll p-8">
        <div id="main-content-p2" class="max-w-4xl mx-auto">
          <!-- 动态渲染主画布内容 -->
        </div>
      </main>
    </div>


    <!-- ==================== 方案 3: 顶部分段控制器单栏 (Top Segmented Switcher) ==================== -->
    <div id="view-proposal-3" class="hidden w-full h-full flex">
      <!-- 传统单边栏尺寸 (250px)，但优化结构：将原本在底部的切换器移到最顶部 Header 下方！ -->
      <aside class="w-60 border-r border-[var(--border)] bg-[var(--sidebar-bg)] flex flex-col justify-between shrink-0">
        <div>
          <!-- Header: Logo + 折叠按钮 -->
          <div class="p-3 border-b border-[var(--border)] flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="size-6 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-bold text-xs">
                Z
              </div>
              <span class="font-semibold text-sm">ZenLink</span>
            </div>
            <button class="size-7 rounded hover:bg-[var(--muted)] flex items-center justify-center text-[var(--muted-fg)]">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
            </button>
          </div>

          <!-- 关键改变：核心模式直接作为侧边栏的一等公民置顶！ -->
          <div class="p-2 border-b border-[var(--border)]/60">
            <div class="p-1 bg-[var(--muted)] rounded-xl flex items-center text-xs font-medium">
              <button onclick="setAppMode('home')" class="p3-btn-mode-home flex-1 py-1 rounded-lg text-center font-semibold bg-[var(--card)] shadow-xs">导航</button>
              <button onclick="setAppMode('ai')" class="p3-btn-mode-ai flex-1 py-1 rounded-lg text-center text-[var(--muted-fg)] hover:text-[var(--fg)]">AI</button>
              <button onclick="setAppMode('notes')" class="p3-btn-mode-notes flex-1 py-1 rounded-lg text-center text-[var(--muted-fg)] hover:text-[var(--fg)]">笔记</button>
            </div>
          </div>

          <!-- 对应内容列表 -->
          <div id="p3-content-list" class="p-2 space-y-1 text-xs custom-scroll max-h-[500px] overflow-y-auto">
            <!-- 动态渲染 -->
          </div>
        </div>

        <!-- 底部仅保留纯粹的用户卡片与系统设置 -->
        <div class="p-3 border-t border-[var(--border)] flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="size-7 rounded-full bg-zinc-200 dark:bg-zinc-800 flex items-center justify-center font-semibold text-xs">404</div>
            <span class="text-xs font-medium">系统管理员</span>
          </div>
          <button class="size-7 rounded-lg hover:bg-[var(--muted)] flex items-center justify-center text-[var(--muted-fg)]">
            <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
          </button>
        </div>
      </aside>

      <!-- 主画布 -->
      <main class="flex-1 overflow-y-auto custom-scroll p-8">
        <div id="main-content-p3" class="max-w-5xl mx-auto">
          <!-- 动态渲染主画布内容 -->
        </div>
      </main>
    </div>


    <!-- ==================== 方案 4: 禅模式自适应 (Zen Adaptive Mode) ==================== -->
    <div id="view-proposal-4" class="hidden w-full h-full relative flex">
      <!-- 当在【导航主页】时，侧边栏完全收起为极简浮动悬浮药丸；当切换到【AI】或【笔记】时，平滑展开侧边栏！ -->
      <aside id="p4-sidebar" class="w-0 overflow-hidden border-r border-[var(--border)] bg-[var(--sidebar-bg)] flex flex-col justify-between shrink-0 transition-width">
        <div>
          <div class="p-3 border-b border-[var(--border)] flex items-center justify-between">
            <span id="p4-sidebar-title" class="font-semibold text-xs">工作区</span>
            <button onclick="toggleP4Sidebar()" class="size-6 rounded hover:bg-[var(--muted)] flex items-center justify-center text-[var(--muted-fg)]">
              <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
          </div>
          <div id="p4-content-list" class="p-2 space-y-1 text-xs custom-scroll">
            <!-- 动态渲染 -->
          </div>
        </div>
        <div class="p-3 border-t border-[var(--border)] flex items-center gap-2">
          <div class="size-7 rounded-full bg-zinc-200 dark:bg-zinc-800 flex items-center justify-center text-xs">404</div>
          <span class="text-xs font-medium">管理员</span>
        </div>
      </aside>

      <!-- 悬浮触发器 (导航模式下浮在左上角) -->
      <div id="p4-floating-trigger" class="absolute top-4 left-4 z-30 flex items-center gap-1.5 p-1.5 bg-[var(--card)]/90 backdrop-blur-md rounded-xl border border-[var(--border)] shadow-md">
        <button onclick="toggleP4Sidebar()" class="size-7 rounded-lg flex items-center justify-center hover:bg-[var(--muted)] text-[var(--fg)]" title="展开侧边抽屉">
          <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="text-xs font-semibold px-1 text-[var(--fg)]">ZenLink</span>
        <div class="h-3 w-px bg-[var(--border)]"></div>
        <button onclick="setAppMode('ai')" class="text-xs px-2 py-1 rounded-md hover:bg-[var(--muted)] text-[var(--muted-fg)] hover:text-[var(--fg)]">进入 AI</button>
        <button onclick="setAppMode('notes')" class="text-xs px-2 py-1 rounded-md hover:bg-[var(--muted)] text-[var(--muted-fg)] hover:text-[var(--fg)]">进入 笔记</button>
      </div>

      <!-- 主画布 -->
      <main class="flex-1 overflow-y-auto custom-scroll p-8">
        <div id="main-content-p4" class="max-w-4xl mx-auto pt-10">
          <!-- 动态渲染主画布内容 -->
        </div>
      </main>
    </div>

  </div>

  <script>
    // 模拟数据源
    const categories = [
      { name: '🔥 常用置顶', count: 12, active: true },
      { name: '🤖 AI 工具', count: 18 },
      { name: '💻 前端与开发', count: 35 },
      { name: '🎨 灵感与设计', count: 24 },
      { name: '📚 知识与阅读', count: 16 },
      { name: '🛠️ 站长实用工具', count: 8 },
    ];

    const aiChats = [
      { title: '重构侧边栏 UI 设计方案', pinned: true, time: '刚刚' },
      { title: 'Docker 镜像打包优化', pinned: true, time: '昨天' },
      { title: 'Vue3 Composition API 讨论', pinned: false, time: '3天前' },
      { title: 'PostgreSQL 全文检索调优', pinned: false, time: '上周' },
    ];

    const notesCats = [
      { name: '📂 全部笔记', count: 42, active: true },
      { name: '💡 创意想法', count: 15 },
      { name: '🛠️ 代码片段', count: 18 },
      { name: '📖 读书摘要', count: 9 },
    ];

    let currentProposal = 1;
    let currentMode = 'home'; // 'home' | 'ai' | 'notes'
    let p1DrawerOpen = true;
    let p4SidebarOpen = false;

    // 方案描述
    const descriptions = {
      1: "💡 <strong>方案 1（双轨 Slim Dock）：</strong> 56px 极简左边栏常驻核心功能，右侧抽屉按需展开。主页看书签时抽屉可收缩，拥有最大沉浸呼吸感！",
      2: "💡 <strong>方案 2（悬浮岛屿卡片）：</strong> 打破贯穿式硬边框，四周留白 + 大圆角 + 柔和阴影，像极了 macOS / Raycast 的精致质感。",
      3: "💡 <strong>方案 3（顶部分段控制器）：</strong> 不改动大结构，但把核心模式切换从最底下搬到最顶部，符合从上到下的自然阅读动线。",
      4: "💡 <strong>方案 4（禅模式自适应）：</strong> 导航主页完全隐藏侧边栏，居中展示搜索与书签；只有点进 AI 或笔记时才自动滑出侧边栏！"
    };

    function switchProposal(n) {
      currentProposal = n;
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`view-proposal-${i}`).classList.add('hidden');
        const btn = document.getElementById(`btn-p${i}`);
        btn.className = "px-3 py-1 rounded-lg transition-all text-xs text-[var(--muted-fg)] hover:text-[var(--fg)]";
      }
      document.getElementById(`view-proposal-${n}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-p${n}`);
      activeBtn.className = "px-3 py-1 rounded-lg transition-all text-xs font-semibold shadow-xs bg-[var(--card)] text-[var(--fg)]";
      document.getElementById('proposal-desc').innerHTML = descriptions[n];

      // 特殊处理方案 4
      if (n === 4) {
        if (currentMode === 'home') {
          p4SidebarOpen = false;
        } else {
          p4SidebarOpen = true;
        }
        applyP4Sidebar();
      }
      renderAll();
    }

    function setAppMode(mode) {
      currentMode = mode;
      // 同步顶部微型按钮
      ['home', 'ai', 'notes'].forEach(m => {
        const b = document.getElementById(`mode-${m}`);
        if (m === mode) {
          b.className = "px-2.5 py-1 rounded-md bg-[var(--card)] font-semibold shadow-xs text-[var(--fg)]";
        } else {
          b.className = "px-2.5 py-1 rounded-md text-[var(--muted-fg)] hover:text-[var(--fg)]";
        }
      });

      // 方案 4 智能响应模式切换
      if (currentProposal === 4) {
        p4SidebarOpen = (mode !== 'home');
        applyP4Sidebar();
      }

      renderAll();
    }

    function toggleP1Drawer() {
      p1DrawerOpen = !p1DrawerOpen;
      const drawer = document.getElementById('p1-drawer');
      if (p1DrawerOpen) {
        drawer.style.width = '14rem';
      } else {
        drawer.style.width = '0px';
      }
    }

    function toggleP4Sidebar() {
      p4SidebarOpen = !p4SidebarOpen;
      applyP4Sidebar();
    }

    function applyP4Sidebar() {
      const sb = document.getElementById('p4-sidebar');
      const trg = document.getElementById('p4-floating-trigger');
      if (p4SidebarOpen) {
        sb.style.width = '15rem';
        trg.classList.add('hidden');
      } else {
        sb.style.width = '0px';
        trg.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    // 渲染各视图内容
    function renderAll() {
      renderP1();
      renderP2();
      renderP3();
      renderP4();
      renderMainCanvas();
    }

    function renderP1() {
      // 更新 Dock 图标状态
      ['home', 'ai', 'notes'].forEach(m => {
        const btn = document.getElementById(`dock-p1-${m}`);
        if (m === currentMode) {
          btn.className = "group relative size-10 rounded-xl flex items-center justify-center transition-all bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 shadow-xs";
        } else {
          btn.className = "group relative size-10 rounded-xl flex items-center justify-center transition-all text-[var(--muted-fg)] hover:text-[var(--fg)] hover:bg-[var(--muted)]";
        }
      });

      const drawerTitle = document.getElementById('p1-drawer-title');
      const drawerContent = document.getElementById('p1-drawer-content');

      if (currentMode === 'home') {
        drawerTitle.textContent = '分类导航';
        drawerContent.innerHTML = categories.map((c, i) => `
          <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-left transition-colors ${i === 0 ? 'bg-[var(--accent)] font-medium text-[var(--fg)]' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)]'}">
            <span class="truncate">${c.name}</span>
            <span class="text-[10px] opacity-60 font-mono">${c.count}</span>
          </button>
        `).join('');
      } else if (currentMode === 'ai') {
        drawerTitle.textContent = 'AI 聊天记录';
        drawerContent.innerHTML = `
          <button class="w-full mb-2 flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-fg)] font-medium text-xs shadow-xs justify-center">
            <span>+ 新建对话</span>
          </button>
          ${aiChats.map(c => `
            <button class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-left transition-colors text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)]">
              <div class="truncate flex-1 pr-1">
                <div class="truncate font-medium text-[var(--fg)]">${c.pinned ? '📌 ' : ''}${c.title}</div>
                <div class="text-[10px] text-[var(--muted-fg)]">${c.time}</div>
              </div>
            </button>
          `).join('')}
        `;
      } else if (currentMode === 'notes') {
        drawerTitle.textContent = '笔记分类';
        drawerContent.innerHTML = `
          <button class="w-full mb-2 flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--muted)] font-medium text-xs justify-center">
            <span>+ 新建笔记</span>
          </button>
          ${notesCats.map(c => `
            <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-left transition-colors ${c.active ? 'bg-[var(--accent)] font-medium text-[var(--fg)]' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)]'}">
              <span class="truncate">${c.name}</span>
              <span class="text-[10px] opacity-60 font-mono">${c.count}</span>
            </button>
          `).join('')}
        `;
      }
    }

    function renderP2() {
      // 方案 2 模式 Switcher
      ['home', 'ai', 'notes'].forEach(m => {
        const b = document.querySelector(`.p2-btn-mode-${m}`);
        if (b) {
          if (m === currentMode) {
            b.className = `p2-btn-mode-${m} flex-1 py-1.5 text-center font-semibold rounded-lg bg-[var(--card)] shadow-xs text-[var(--fg)]`;
          } else {
            b.className = `p2-btn-mode-${m} flex-1 py-1.5 text-center text-[var(--muted-fg)] rounded-lg hover:text-[var(--fg)]`;
          }
        }
      });

      const list = document.getElementById('p2-content-list');
      if (currentMode === 'home') {
        list.innerHTML = categories.map((c, i) => `
          <div class="px-3 py-2 rounded-xl flex items-center justify-between cursor-pointer ${i===0 ? 'bg-[var(--accent)] font-semibold' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)]'}">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      } else if (currentMode === 'ai') {
        list.innerHTML = `
          <button class="w-full mb-2 py-2 rounded-xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium text-xs">+ 新对话</button>
          ${aiChats.map(c => `
            <div class="px-3 py-2 rounded-xl cursor-pointer hover:bg-[var(--muted)]">
              <div class="truncate font-medium">${c.pinned ? '📌 ' : ''}${c.title}</div>
              <div class="text-[10px] text-[var(--muted-fg)]">${c.time}</div>
            </div>
          `).join('')}
        `;
      } else {
        list.innerHTML = notesCats.map(c => `
          <div class="px-3 py-2 rounded-xl flex items-center justify-between cursor-pointer ${c.active ? 'bg-[var(--accent)] font-semibold' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)]'}">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      }
    }

    function renderP3() {
      // 方案 3 顶部分段控制器按钮
      ['home', 'ai', 'notes'].forEach(m => {
        const b = document.querySelector(`.p3-btn-mode-${m}`);
        if (b) {
          if (m === currentMode) {
            b.className = `p3-btn-mode-${m} flex-1 py-1 rounded-lg text-center font-semibold bg-[var(--card)] shadow-xs text-[var(--fg)]`;
          } else {
            b.className = `p3-btn-mode-${m} flex-1 py-1 rounded-lg text-center text-[var(--muted-fg)] hover:text-[var(--fg)]`;
          }
        }
      });

      const list = document.getElementById('p3-content-list');
      if (currentMode === 'home') {
        list.innerHTML = categories.map((c, i) => `
          <div class="px-2.5 py-1.5 rounded-lg flex items-center justify-between cursor-pointer ${i===0 ? 'bg-[var(--accent)] font-semibold' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)]'}">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      } else if (currentMode === 'ai') {
        list.innerHTML = `
          <button class="w-full mb-2 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--muted)] font-medium text-xs">+ 新建会话</button>
          ${aiChats.map(c => `
            <div class="px-2.5 py-1.5 rounded-lg cursor-pointer hover:bg-[var(--muted)]">
              <div class="truncate font-medium">${c.pinned ? '📌 ' : ''}${c.title}</div>
            </div>
          `).join('')}
        `;
      } else {
        list.innerHTML = notesCats.map(c => `
          <div class="px-2.5 py-1.5 rounded-lg flex items-center justify-between cursor-pointer ${c.active ? 'bg-[var(--accent)] font-semibold' : 'text-[var(--muted-fg)] hover:bg-[var(--muted)]'}">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      }
    }

    function renderP4() {
      const title = document.getElementById('p4-sidebar-title');
      const list = document.getElementById('p4-content-list');
      title.textContent = currentMode === 'home' ? '分类导航' : (currentMode === 'ai' ? 'AI 历史' : '笔记树');

      if (currentMode === 'home') {
        list.innerHTML = categories.map(c => `
          <div class="px-2.5 py-1.5 rounded-lg flex items-center justify-between text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)] cursor-pointer">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      } else if (currentMode === 'ai') {
        list.innerHTML = aiChats.map(c => `
          <div class="px-2.5 py-1.5 rounded-lg hover:bg-[var(--muted)] cursor-pointer">
            <div class="truncate font-medium">${c.title}</div>
          </div>
        `).join('');
      } else {
        list.innerHTML = notesCats.map(c => `
          <div class="px-2.5 py-1.5 rounded-lg flex items-center justify-between text-[var(--muted-fg)] hover:bg-[var(--muted)] hover:text-[var(--fg)] cursor-pointer">
            <span>${c.name}</span>
            <span class="text-[10px] opacity-60">${c.count}</span>
          </div>
        `).join('');
      }
    }

    // 渲染右侧内容画布模拟真实网页
    function renderMainCanvas() {
      const htmlContent = `
        <!-- 搜索框模拟 -->
        <div class="mb-8 text-center max-w-xl mx-auto">
          <div class="relative flex items-center">
            <input type="text" placeholder="搜索书签或直接敲回车百度一下..." class="w-full h-11 px-4 pr-12 rounded-2xl bg-[var(--muted)]/80 border border-[var(--border)] focus:bg-[var(--card)] focus:border-zinc-500 outline-none text-sm transition-all shadow-xs" />
            <button class="absolute right-2 px-3 py-1 rounded-xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 text-xs font-medium">搜索</button>
          </div>
          <div class="mt-2 text-[11px] text-[var(--muted-fg)] italic">"保持好奇，探索未知。"</div>
        </div>

        <!-- 当前模式的模拟界面展示 -->
        ${currentMode === 'home' ? `
          <!-- 常用置顶书签 -->
          <div class="space-y-6">
            <div>
              <div class="flex items-center gap-2 mb-3">
                <span class="text-xs font-bold text-[var(--fg)] uppercase tracking-wider">🔥 常用推荐</span>
                <div class="h-px flex-1 bg-[var(--border)]"></div>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                ${['GitHub', 'ChatGPT', 'V2EX', 'Bilibili', 'YouTube', 'Notion', 'Linux Do', 'Google'].map(site => `
                  <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:shadow-sm hover:border-zinc-400 transition-all flex items-center gap-3 cursor-pointer group">
                    <div class="size-8 rounded-lg bg-[var(--muted)] flex items-center justify-center font-bold text-xs group-hover:scale-105 transition-transform">
                      ${site[0]}
                    </div>
                    <div class="truncate">
                      <div class="font-medium text-xs truncate group-hover:text-blue-500 transition-colors">${site}</div>
                      <div class="text-[10px] text-[var(--muted-fg)] truncate">https://${site.toLowerCase()}.com</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="flex items-center gap-2 mb-3">
                <span class="text-xs font-bold text-[var(--fg)] uppercase tracking-wider">🤖 AI 探索</span>
                <div class="h-px flex-1 bg-[var(--border)]"></div>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                ${['Claude', 'DeepSeek', 'Perplexity', 'Midjourney'].map(site => `
                  <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:shadow-sm hover:border-zinc-400 transition-all flex items-center gap-3 cursor-pointer group">
                    <div class="size-8 rounded-lg bg-[var(--muted)] flex items-center justify-center font-bold text-xs group-hover:scale-105 transition-transform">
                      ${site[0]}
                    </div>
                    <div class="truncate">
                      <div class="font-medium text-xs truncate group-hover:text-blue-500 transition-colors">${site}</div>
                      <div class="text-[10px] text-[var(--muted-fg)] truncate">AI 智能助手平台</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        ` : currentMode === 'ai' ? `
          <div class="border border-[var(--border)] rounded-2xl p-6 bg-[var(--card)] shadow-xs min-h-[400px] flex flex-col justify-between">
            <div>
              <div class="text-base font-bold mb-1">重构侧边栏 UI 设计方案</div>
              <div class="text-xs text-[var(--muted-fg)] mb-4">使用模型：Claude 3.5 Sonnet · 2026-09-06</div>
              <div class="p-4 rounded-xl bg-[var(--muted)]/50 text-xs leading-relaxed space-y-2 border border-[var(--border)]/40">
                <p><strong>AI 回复：</strong> 您好！对于侧边栏的优化，我们提供了 4 种现代 Web 界面设计思路：</p>
                <ul class="list-disc pl-4 space-y-1">
                  <li><strong>方案 1（双轨 Dock）：</strong> 类似 Slack/Notion，左侧 56px 保持全局整洁，按需展开抽屉。</li>
                  <li><strong>方案 2（悬浮岛屿）：</strong> 柔和圆角卡片，消除生硬的贯穿分割线。</li>
                </ul>
              </div>
            </div>
            <div class="pt-4 border-t border-[var(--border)]">
              <input type="text" placeholder="向 AI 提问..." class="w-full h-10 px-4 rounded-xl bg-[var(--muted)] border border-[var(--border)] text-xs outline-none" />
            </div>
          </div>
        ` : `
          <div class="border border-[var(--border)] rounded-2xl p-6 bg-[var(--card)] shadow-xs min-h-[400px]">
            <div class="text-base font-bold mb-2">我的第一个 ZenLink 笔记</div>
            <div class="text-xs text-[var(--muted-fg)] mb-4">标签：#设计 #灵感 · 最后更新：今天 09:30</div>
            <div class="text-xs leading-relaxed text-[var(--fg)] space-y-3">
              <p>这里是在线笔记的编辑区域，在保持左侧目录清晰的前提下，拥有大块开阔的书写空间。</p>
              <div class="p-3 bg-[var(--muted)] rounded-lg font-mono text-[11px]">
                const layout = "DualRail" || "FloatingIsland";
              </div>
            </div>
          </div>
        `}
      `;

      ['p1', 'p2', 'p3', 'p4'].forEach(p => {
        const el = document.getElementById(`main-content-${p}`);
        if (el) el.innerHTML = htmlContent;
      });
    }

    // 初始化渲染
    renderAll();
  </script>
</body>
</html>
