<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：现代黑曜石深色微过渡 -->
    <linearGradient id="zen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>

    <!-- 品牌主色渐变：克制纯粹的珊瑚绯红至玫瑰深红 -->
    <linearGradient id="zen-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="50%" stop-color="#f1404b"/>
      <stop offset="100%" stop-color="#d91b40"/>
    </linearGradient>

    <linearGradient id="zen-brand-alt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5e7b"/>
      <stop offset="50%" stop-color="#f1404b"/>
      <stop offset="100%" stop-color="#cc183a"/>
    </linearGradient>

    <!-- 柔和微投影增强立体层次 -->
    <filter id="zen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#f1404b" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 1. 外部圆角超椭圆容器 (Squircle) -->
  <rect width="512" height="512" rx="124" fill="url(#zen-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="122" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- 2. 核心图腾：极简双环互锁构成的 Zen-Link 几何字母 Z -->
  <g filter="url(#zen-shadow)">
    <!-- 上半部环形链扣 (Top Link Node) -->
    <path d="M 152 164 H 328 C 362 164 384 186 384 216 C 384 240 370 258 350 268 L 226 352" 
          fill="none" 
          stroke="url(#zen-brand)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 下半部环形链扣 (Bottom Link Node) 形成完美互锁与对角穿插 -->
    <path d="M 360 348 H 184 C 150 348 128 326 128 296 C 128 272 142 254 162 244 L 286 160" 
          fill="none" 
          stroke="url(#zen-brand-alt)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 中枢互锁连接核心点 (Zen Link Core) -->
    <circle cx="256" cy="256" r="22" fill="#ffffff" />
    <circle cx="256" cy="256" r="12" fill="#f1404b" />
  </g>
</svg>