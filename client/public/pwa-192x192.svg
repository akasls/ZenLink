<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景流光渐变 -->
    <linearGradient id="zl-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- 主体 Z-Link 霓虹流动渐变 -->
    <linearGradient id="zl-main-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 次级光晕渐变 -->
    <linearGradient id="zl-accent-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- 柔和外发光滤镜 -->
    <filter id="zl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 顶部高光微反光 -->
    <linearGradient id="zl-glass-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. 圆角 Squircle 容器背景 -->
  <rect width="512" height="512" rx="118" fill="url(#zl-bg-grad)"/>

  <!-- 2. 外部微发光细边框 -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="url(#zl-main-grad)" stroke-width="3.5" stroke-opacity="0.45"/>

  <!-- 3. 背景微光晕粒子 -->
  <circle cx="160" cy="160" r="140" fill="#f43f5e" opacity="0.16"/>
  <circle cx="350" cy="350" r="140" fill="#6366f1" opacity="0.22"/>
  <circle cx="360" cy="150" r="110" fill="#38bdf8" opacity="0.18"/>

  <!-- 4. 核心 Z-Link 图标几何体 (互锁环形超椭圆，代表 Zen + Link 极简连接) -->
  <g filter="url(#zl-glow)">
    <!-- 上部左侧环 (环形链扣 1) -->
    <path d="M168 144 H304 C352 144 384 176 384 216 C384 250 358 276 324 286 L210 324" 
          fill="none" stroke="url(#zl-main-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 下部右侧环 (环形链扣 2 与 Z 形对角线强力穿插) -->
    <path d="M344 368 H208 C160 368 128 336 128 296 C128 262 154 236 188 226 L302 188" 
          fill="none" stroke="url(#zl-accent-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 中枢 Z 轴光感连接核 -->
    <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.95" />
    <circle cx="256" cy="256" r="32" fill="url(#zl-main-grad)" opacity="0.5" />
  </g>

  <!-- 5. 顶部有机玻璃质感弧光 -->
  <path d="M0 118 C0 52 52 0 118 0 H394 C460 0 512 52 512 118 V220 C410 250 280 240 180 210 C80 180 0 200 0 200 Z" 
        fill="url(#zl-glass-reflect)" />
</svg>